<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="robots" content="noindex,nofollow">
  <title>Reps Central — Maintenance</title>
  <style>
    :root {
      color-scheme: dark;
      font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      background: #070707;
      color: #f5f5f5;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
      overflow: hidden;
      background:
        radial-gradient(circle at 20% 0%, rgba(255,255,255,.08), transparent 32%),
        radial-gradient(circle at 80% 100%, rgba(255,255,255,.05), transparent 30%),
        #070707;
    }
    .grid {
      position: fixed;
      inset: 0;
      pointer-events: none;
      opacity: .16;
      background-image:
        linear-gradient(rgba(255,255,255,.08) 1px, transparent 1px),
        linear-gradient(90deg, rgba(255,255,255,.08) 1px, transparent 1px);
      background-size: 42px 42px;
      mask-image: linear-gradient(to bottom, black, transparent 85%);
    }
    main {
      width: min(92vw, 560px);
      position: relative;
      z-index: 1;
      padding: 44px;
      border: 1px solid rgba(255,255,255,.12);
      border-radius: 28px;
      background: rgba(17,17,17,.78);
      backdrop-filter: blur(18px);
      box-shadow: 0 24px 90px rgba(0,0,0,.45);
    }
    .badge {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      padding: 8px 11px;
      border: 1px solid rgba(255,255,255,.12);
      border-radius: 999px;
      font-size: 12px;
      color: #cfcfcf;
      background: rgba(255,255,255,.04);
    }
    .dot {
      width: 7px;
      height: 7px;
      border-radius: 50%;
      background: #fff;
      box-shadow: 0 0 18px rgba(255,255,255,.75);
    }
    h1 {
      margin: 24px 0 14px;
      font-size: clamp(34px, 7vw, 58px);
      line-height: .98;
      letter-spacing: -.055em;
      font-weight: 760;
    }
    p {
      margin: 0;
      color: #a8a8a8;
      font-size: 15px;
      line-height: 1.65;
    }
    .admin {
      margin-top: 30px;
      padding-top: 24px;
      border-top: 1px solid rgba(255,255,255,.1);
    }
    .admin-toggle {
      appearance: none;
      border: 0;
      background: transparent;
      padding: 0;
      color: #7e7e7e;
      font: inherit;
      font-size: 12px;
      cursor: pointer;
    }
    form {
      display: none;
      margin-top: 14px;
      gap: 10px;
    }
    form.open { display: flex; }
    input {
      min-width: 0;
      flex: 1;
      height: 46px;
      border: 1px solid rgba(255,255,255,.12);
      border-radius: 14px;
      padding: 0 14px;
      background: rgba(255,255,255,.05);
      color: #fff;
      outline: none;
      font: inherit;
    }
    input:focus { border-color: rgba(255,255,255,.34); }
    button[type="submit"] {
      height: 46px;
      border: 0;
      border-radius: 14px;
      padding: 0 18px;
      background: #fff;
      color: #0a0a0a;
      font: inherit;
      font-weight: 700;
      cursor: pointer;
    }
    .status {
      min-height: 18px;
      margin-top: 10px;
      font-size: 12px;
      color: #8f8f8f;
    }
    @media (max-width: 560px) {
      main { padding: 30px 24px; border-radius: 22px; }
      form.open { flex-direction: column; }
      button[type="submit"] { width: 100%; }
    }
  </style>
</head>
<body>
  <div class="grid"></div>
  <main>
    <div class="badge"><span class="dot"></span> Scheduled maintenance</div>
    <h1>We’ll be right back.</h1>
    <p>Reps Central is temporarily offline while we upgrade the catalogue system. The site will return automatically once the migration is complete.</p>

    <div class="admin">
      <button class="admin-toggle" id="adminToggle" type="button">Admin access</button>
      <form id="adminForm" autocomplete="off">
        <input id="password" type="password" placeholder="Admin password" autocomplete="current-password" required>
        <button type="submit">Enter</button>
      </form>
      <div class="status" id="status" aria-live="polite"></div>
    </div>
  </main>

  <script>
    const params = new URLSearchParams(location.search);
    const returnTo = params.get("return") || "/";
    const toggle = document.getElementById("adminToggle");
    const form = document.getElementById("adminForm");
    const password = document.getElementById("password");
    const status = document.getElementById("status");

    toggle.addEventListener("click", () => {
      form.classList.toggle("open");
      if (form.classList.contains("open")) password.focus();
    });

    form.addEventListener("submit", async (event) => {
      event.preventDefault();
      status.textContent = "Checking…";

      try {
        const response = await fetch("/api/maintenance-bypass", {
          method: "POST",
          headers: { "content-type": "application/json" },
          credentials: "same-origin",
          body: JSON.stringify({ password: password.value })
        });

        const data = await response.json().catch(() => ({}));

        if (!response.ok) {
          status.textContent = data.error || "Incorrect password.";
          password.select();
          return;
        }

        status.textContent = "Access granted.";
        location.replace(returnTo.startsWith("/") ? returnTo : "/");
      } catch {
        status.textContent = "Could not verify access. Try again.";
      }
    });
  </script>
</body>
</html>
