<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="robots" content="noindex,nofollow">
  <title>Reps Central — Maintenance</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Syne:wght@400;600;700;800&family=DM+Sans:ital,opsz,wght@0,9..40,300;0,9..40,400;0,9..40,500&display=swap" rel="stylesheet">
  <style>
    :root {
      color-scheme: dark;
      font-family: "DM Sans", ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      background: #070707;
      color: #f5f5f5;
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
      background: #070707;
      padding: 24px;
    }

    main {
      width: min(92vw, 620px);
      text-align: center;
    }

    .icon {
      font-size: 54px;
      line-height: 1;
      margin-bottom: 22px;
    }

    h1 {
      margin: 0;
      font-size: clamp(34px, 7vw, 58px);
      line-height: 1;
      letter-spacing: -.04em;
      font-weight: 800;
    }

    p {
      margin: 18px auto 0;
      max-width: 560px;
      color: #a8a8a8;
      font-size: 16px;
      line-height: 1.65;
    }

    .admin { margin-top: 34px; }

    .admin-toggle {
      appearance: none;
      border: 0;
      background: transparent;
      color: #555;
      font: inherit;
      font-size: 12px;
      cursor: pointer;
    }

    .login-wrap {
      display: none;
      position: fixed;
      inset: 0;
      z-index: 20;
      place-items: center;
      padding: 24px;
      background: rgba(10,10,11,.96);
    }

    .login-wrap.open { display: grid; }

    .login-card {
      width: min(420px, 100%);
      padding: 28px;
      border: 1px solid #29292f;
      border-radius: 16px;
      background: #111114;
      text-align: left;
    }

    .brand {
      margin-bottom: 26px;
      font-family: "Syne", ui-sans-serif, system-ui, sans-serif;
      font-size: 18px;
      font-weight: 800;
    }

    .login-card h2 {
      margin: 0;
      font-family: "Syne", ui-sans-serif, system-ui, sans-serif;
      font-size: clamp(34px, 8vw, 48px);
      line-height: 1;
      letter-spacing: -.04em;
    }

    .login-copy {
      margin: 10px 0 20px;
      color: #92929c;
      font-size: 13px;
      line-height: 1.55;
    }

    .fields { display: grid; gap: 13px; }
    .field { display: grid; gap: 7px; }

    .field label {
      color: #92929c;
      font-size: 11px;
      font-weight: 700;
      letter-spacing: .08em;
      text-transform: uppercase;
    }

    .field input {
      width: 100%;
      min-height: 44px;
      padding: 0 12px;
      border: 1px solid #29292f;
      border-radius: 9px;
      outline: 0;
      background: #0e0e11;
      color: #f0f0f0;
      font: inherit;
    }

    .field input:focus {
      border-color: rgba(77,166,255,.7);
      box-shadow: 0 0 0 3px rgba(77,166,255,.12);
    }

    .login-btn {
      width: 100%;
      min-height: 44px;
      margin-top: 16px;
      border: 0;
      border-radius: 9px;
      background: #4da6ff;
      color: #fff;
      font: 700 13px ui-sans-serif, system-ui, sans-serif;
      cursor: pointer;
    }

    .status {
      min-height: 20px;
      margin-top: 10px;
      color: #ff6b6b;
      font-size: 13px;
    }

    @media (max-width: 520px) {
      .icon { font-size: 46px; }
    }
  </style>
</head>
<body>
  <main>
    <div class="icon">⚠️</div>
    <h1>MAINTENANCE</h1>
    <p>We're upgrading things to improve your experience. This will take no longer than a few hours.</p>

    <div class="admin">
      <button class="admin-toggle" id="adminToggle" type="button">Admin access</button>
      <div class="login-wrap" id="loginWrap">
        <form class="login-card" id="adminForm" autocomplete="off">
          <div class="brand">repscentral</div>
          <h2>ADMIN ACCESS</h2>
          <p class="login-copy">Enter the maintenance admin password to continue.</p>
          <div class="fields">
            <div class="field">
              <label for="password">Password</label>
              <input id="password" type="password" autocomplete="current-password" required>
            </div>
          </div>
          <button class="login-btn" type="submit">Sign In</button>
          <div class="status" id="status" aria-live="polite"></div>
        </form>
      </div>
    </div>
  </main>

  <script>
    const params = new URLSearchParams(location.search);
    const returnTo = params.get("return") || "/";
    const toggle = document.getElementById("adminToggle");
    const loginWrap = document.getElementById("loginWrap");
    const form = document.getElementById("adminForm");
    const password = document.getElementById("password");
    const status = document.getElementById("status");

    toggle.addEventListener("click", () => {
      loginWrap.classList.add("open");
      password.focus();
    });

    loginWrap.addEventListener("click", event => {
      if (event.target === loginWrap) loginWrap.classList.remove("open");
    });

    document.addEventListener("keydown", event => {
      if (event.key === "Escape") loginWrap.classList.remove("open");
    });

    form.addEventListener("submit", async (event) => {
      event.preventDefault();
      status.textContent = "Checking…";

      try {
        const response = await fetch("/api/maintenance-bypass", {
          method: "POST",
          headers: { "content-type": "application/json" },
          credentials: "same-origin",
          body: JSON.stringify({ password: password.value })
        });

        const data = await response.json().catch(() => ({}));

        if (!response.ok) {
          status.textContent = data.error || "Incorrect password.";
          password.select();
          return;
        }

        status.textContent = "Access granted.";
        location.replace(returnTo.startsWith("/") ? returnTo : "/");
      } catch {
        status.textContent = "Could not verify access. Try again.";
      }
    });
  </script>
</body>
</html>
