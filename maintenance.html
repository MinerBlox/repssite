<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="robots" content="noindex,nofollow">
  <title>Reps Central — Maintenance</title>
  <style>
    :root {
      color-scheme: dark;
      font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      background: #070707;
      color: #f5f5f5;
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
      background: #070707;
      padding: 24px;
    }

    main {
      width: min(92vw, 620px);
      text-align: center;
    }

    .icon {
      font-size: 54px;
      line-height: 1;
      margin-bottom: 22px;
    }

    h1 {
      margin: 0;
      font-size: clamp(34px, 7vw, 58px);
      line-height: 1;
      letter-spacing: -.04em;
      font-weight: 800;
    }

    p {
      margin: 18px auto 0;
      max-width: 560px;
      color: #a8a8a8;
      font-size: 16px;
      line-height: 1.65;
    }

    .admin {
      margin-top: 34px;
    }

    .admin-toggle {
      appearance: none;
      border: 0;
      background: transparent;
      color: #555;
      font: inherit;
      font-size: 12px;
      cursor: pointer;
    }

    form {
      display: none;
      margin: 14px auto 0;
      max-width: 420px;
      gap: 10px;
    }

    form.open { display: flex; }

    input {
      min-width: 0;
      flex: 1;
      height: 44px;
      border: 1px solid #222;
      border-radius: 12px;
      padding: 0 14px;
      background: #101010;
      color: #fff;
      outline: none;
      font: inherit;
    }

    button[type="submit"] {
      height: 44px;
      border: 0;
      border-radius: 12px;
      padding: 0 16px;
      background: #fff;
      color: #0a0a0a;
      font: inherit;
      font-weight: 700;
      cursor: pointer;
    }

    .status {
      min-height: 18px;
      margin-top: 10px;
      font-size: 12px;
      color: #777;
    }

    @media (max-width: 520px) {
      .icon { font-size: 46px; }
      form.open { flex-direction: column; }
      button[type="submit"] { width: 100%; }
    }
  </style>
</head>
<body>
  <main>
    <div class="icon">⚠️</div>
    <h1>MAINTENANCE</h1>
    <p>We're upgrading things to improve your experience. This will take no longer than a few hours.</p>

    <div class="admin">
      <button class="admin-toggle" id="adminToggle" type="button">Admin access</button>
      <form id="adminForm" autocomplete="off">
        <input id="password" type="password" placeholder="Admin password" autocomplete="current-password" required>
        <button type="submit">Enter</button>
      </form>
      <div class="status" id="status" aria-live="polite"></div>
    </div>
  </main>

  <script>
    const params = new URLSearchParams(location.search);
    const returnTo = params.get("return") || "/";
    const toggle = document.getElementById("adminToggle");
    const form = document.getElementById("adminForm");
    const password = document.getElementById("password");
    const status = document.getElementById("status");

    toggle.addEventListener("click", () => {
      form.classList.toggle("open");
      if (form.classList.contains("open")) password.focus();
    });

    form.addEventListener("submit", async (event) => {
      event.preventDefault();
      status.textContent = "Checking…";

      try {
        const response = await fetch("/api/maintenance-bypass", {
          method: "POST",
          headers: { "content-type": "application/json" },
          credentials: "same-origin",
          body: JSON.stringify({ password: password.value })
        });

        const data = await response.json().catch(() => ({}));

        if (!response.ok) {
          status.textContent = data.error || "Incorrect password.";
          password.select();
          return;
        }

        status.textContent = "Access granted.";
        location.replace(returnTo.startsWith("/") ? returnTo : "/");
      } catch {
        status.textContent = "Could not verify access. Try again.";
      }
    });
  </script>
</body>
</html>
