name: Build Product Cache

on:
  workflow_dispatch:
    inputs:
      target:
        description: Catalogue export to run
        type: choice
        options: [video, spreadsheet, interactions, all]
        default: video
  schedule:
    - cron: "17 0 * * *"
      timezone: "America/Los_Angeles"

permissions:
  contents: read

concurrency:
  group: product-cache-build
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Install cache dependencies
        run: npm install --no-save firebase-admin @aws-sdk/client-s3
      - name: Export Firestore catalogues to R2
        env:
          CATALOG_TARGET: ${{ inputs.target || 'all' }}
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          R2_BUCKET_NAME: ${{ secrets.R2_BUCKET_NAME }}
        run: node scripts/build-product-cache.mjs
